<script type="module">
  import component from '@ape-egg/vibe/component';

  const storage = 'dataInspectorOpenPaths';
  const collator = new Intl.Collator(undefined, { numeric: true });

  let id;
  let last = {};

  const isObject = (value) => value !== null && typeof value === 'object';

  const summarize = (value) => {
    if (typeof value === 'function') return '[Function]';
    if (!isObject(value)) return String(value);
    return Array.isArray(value) ? `[${value.length}]` : `{${Object.keys(value).length}}`;
  };

  const rank = (key, value) => (key.startsWith('_') ? 2 : Number(isObject(value)));

  const sorted = (object) =>
    Object.entries(object).sort(
      ([aKey, aValue], [bKey, bValue]) => rank(aKey, aValue) - rank(bKey, bValue) || collator.compare(aKey, bKey),
    );

  const childPath = (parent, key) => (parent ? `${parent}/${key}` : `${key}`);

  const roots = (data) => (isObject(data) ? sorted(data).filter(([key]) => key !== id) : []);

  const expandablePaths = (data) => {
    const paths = [];
    const ancestors = new Set();
    const visit = (value, path) => {
      if (!isObject(value) || ancestors.has(value)) return;
      paths.push(path);
      ancestors.add(value);
      Object.entries(value).forEach(([key, child]) => visit(child, childPath(path, key)));
      ancestors.delete(value);
    };
    roots(data).forEach(([key, value]) => visit(value, key));
    return paths;
  };

  const view = (data, openPaths) => {
    last = data;
    const rows = [];
    const ancestors = new Set();
    let total = 0;
    let expandable = false;
    let allOpen = true;

    const walk = (value, depth, path, key, shown) => {
      const open = isObject(value) && !!openPaths[path];
      rows.push({ path, key, depth, shown, expandable: isObject(value), summary: summarize(value) });
      if (!isObject(value)) return total++;

      expandable = true;
      allOpen &&= open;
      if (ancestors.has(value)) return;
      ancestors.add(value);
      const entries = Array.isArray(value)
        ? value.map((child, i) => [i, child, `#${i + 1}`])
        : sorted(value).map(([name, child]) => [name, child, name]);
      entries.forEach(([name, child, label]) => walk(child, depth + 1, childPath(path, name), label, shown && open));
      ancestors.delete(value);
    };

    const top = roots(data);
    top.forEach(([key, value]) => walk(value, 0, key, key, true));

    return { rows, shallow: top.length, total, label: expandable && allOpen ? 'Close all' : 'Open all' };
  };

  const persist = (openPaths) => {
    $[id].openPaths = openPaths;
    localStorage.setItem(storage, JSON.stringify(openPaths));
  };

  const toggle = (event, { expandable, path }) => {
    if (!expandable) return;
    const open = !$[id].openPaths[path];
    const paths = event.altKey
      ? [path, ...expandablePaths(last).filter((descendant) => descendant.startsWith(`${path}/`))]
      : [path];
    const next = { ...$[id].openPaths };
    paths.forEach((each) => (open ? (next[each] = true) : delete next[each]));
    persist(next);
  };

  const toggleAll = () => {
    const paths = expandablePaths(last);
    persist(
      paths.length && paths.every((path) => $[id].openPaths[path])
        ? {}
        : { ...$[id].openPaths, ...Object.fromEntries(paths.map((path) => [path, true])) },
    );
  };

  id = component({
    openPaths: JSON.parse(localStorage.getItem(storage)) ?? {},
    view,
    toggle,
    toggleAll,
  });
</script>

<card inspector w="120" max-w-full overflow-hidden>
  <crow justify-between w-full g="6">
    <h6 text-muted>Data (@[this.view(data, this.openPaths).shallow] | @[this.view(data, this.openPaths).total])</h6>
    <button tertiary sm onclick="this.toggleAll()">@[this.view(data, this.openPaths).label]</button>
  </crow>
  <hr />
  <data-inspector-lines vertical left up f-1 mx="-6" overflow-auto>
    <!-- each this.view(data, this.openPaths).rows as row (row.path) -->
    <accordion open="@[row.shown]">
      <accordion-content>
        <data-inspector-row flex w-full g="3" py="0.75" px="2" hover="@[row.expandable]" onclick="this.toggle(event, row)">
          <data-inspector-key f-0 pl="@[row.depth]ch" text-cyan>@[row.key]</data-inspector-key>
          <data-inspector-value flex right f-1 overflow-hidden text-blue="@[row.expandable]" text-orange="@[!row.expandable]">@[row.summary]</data-inspector-value>
        </data-inspector-row>
      </accordion-content>
    </accordion>
    <!-- /each -->
  </data-inspector-lines>
</card>
