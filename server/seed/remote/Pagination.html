<crow pagination justify-between align-center g="2" w="full">
  <button tertiary sm title="Previous" disabled="@[page === 0]" onclick="$.page--"><icon chevron-left></icon></button>
  <span text-sm text-muted>Page @[page + 1] of @[pageCount]</span>
  <button tertiary sm title="Next" disabled="@[page >= pageCount - 1]" onclick="$.page++"><icon chevron-right></icon></button>
</crow>
