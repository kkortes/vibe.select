<script type="module">
  import component from '@ape-egg/vibe/component';

  const collator = new Intl.Collator(undefined, { numeric: true });

  let id;
  let last = {};
  let storage;

  const isObject = (value) => value !== null && typeof value === 'object';

  const summarize = (value) => {
    if (typeof value === 'function') return '[Function]';
    if (!isObject(value)) return String(value);
    return Array.isArray(value) ? `[${value.length}]` : `{${Object.keys(value).length}}`;
  };

  const rank = (key, value) => (key.startsWith('_') ? 2 : Number(isObject(value)));

  const sorted = (object) =>
    Object.entries(object).sort(
      ([aKey, aValue], [bKey, bValue]) => rank(aKey, aValue) - rank(bKey, bValue) || collator.compare(aKey, bKey),
    );

  const read = () => (storage && JSON.parse(localStorage.getItem(storage))) || {};

  const opened = () => $[id].openPaths ?? read();

  const childPath = (parent, key) => (parent ? `${parent}/${key}` : `${key}`);

  const roots = (data) => (isObject(data) ? sorted(data).filter(([key]) => key !== id) : []);

  const expandablePaths = (data) => {
    const paths = [];
    const ancestors = new Set();
    const visit = (value, path) => {
      if (!isObject(value) || ancestors.has(value)) return;
      paths.push(path);
      ancestors.add(value);
      Object.entries(value).forEach(([key, child]) => visit(child, childPath(path, key)));
      ancestors.delete(value);
    };
    roots(data).forEach(([key, value]) => visit(value, key));
    return paths;
  };

  const view = (data, openPaths, localStorageID) => {
    last = data;
    storage = localStorageID && `dataDisplay:${localStorageID}`;
    openPaths ??= read();
    const rows = [];
    const ancestors = new Set();
    let expandable = false;
    let allOpen = true;

    const walk = (value, depth, path, key, shown) => {
      const open = isObject(value) && !!openPaths[path];
      rows.push({ path, key, depth, shown, expandable: isObject(value), list: Array.isArray(value), summary: summarize(value) });
      if (!isObject(value)) return;

      expandable = true;
      allOpen &&= open;
      if (ancestors.has(value)) return;
      ancestors.add(value);
      const entries = Array.isArray(value)
        ? value.map((child, i) => [i, child, `#${i + 1}`])
        : sorted(value).map(([name, child]) => [name, child, name]);
      entries.forEach(([name, child, label]) => walk(child, depth + 1, childPath(path, name), label, shown && open));
      ancestors.delete(value);
    };

    roots(data).forEach(([key, value]) => walk(value, 0, key, key, true));

    return { rows, label: expandable && (allOpen ? 'Close all' : 'Open all') };
  };

  const persist = (openPaths) => {
    $[id].openPaths = openPaths;
    storage && localStorage.setItem(storage, JSON.stringify(openPaths));
  };

  const toggle = (event, { expandable, path }) => {
    if (!expandable) return;
    const open = !opened()[path];
    const paths = event.altKey
      ? [path, ...expandablePaths(last).filter((descendant) => descendant.startsWith(`${path}/`))]
      : [path];
    const next = { ...opened() };
    paths.forEach((each) => (open ? (next[each] = true) : delete next[each]));
    persist(next);
  };

  const toggleAll = () => {
    const paths = expandablePaths(last);
    const openPaths = opened();
    persist(
      paths.length && paths.every((path) => openPaths[path])
        ? {}
        : { ...openPaths, ...Object.fromEntries(paths.map((path) => [path, true])) },
    );
  };

  id = component({
    openPaths: null,
    view,
    toggle,
    toggleAll,
  });
</script>

<card w="120" max-w-full overflow-hidden>
  <crow justify-between w-full g="6">
    <h6 text-muted>Data</h6>
    <!-- if this.view(data, this.openPaths, localStorageID).label -->
    <button tertiary sm onclick="this.toggleAll()">@[this.view(data, this.openPaths, localStorageID).label]</button>
    <!-- /if -->
  </crow>
  <hr my="4" />
  <data-display-lines vertical left up f-1 mx="-6" overflow-auto>
    <!-- each this.view(data, this.openPaths, localStorageID).rows as row (row.path) -->
    <accordion open="@[row.shown]">
      <accordion-content>
        <data-display-row flex w-full g="3" py="0.75" px="6" hover="@[row.expandable]" onclick="this.toggle(event, row)">
          <data-display-key f-0 pl="@[row.depth]ch">@[row.key]</data-display-key>
          <data-display-value flex right f-1 overflow-hidden text-blue="@[row.expandable && !row.list]" text-purple="@[row.list]">@[row.summary]</data-display-value>
        </data-display-row>
      </accordion-content>
    </accordion>
    <!-- /each -->
  </data-display-lines>
</card>

<style>
  data-display-key::first-letter {
    text-transform: uppercase;
  }
</style>
