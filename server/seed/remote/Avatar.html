<avatar-disc circle w-32 overflow-hidden bg-card style="--x: @[x]; --y: @[y]; --zoom: @[zoom || 3]">
  <img src="@[image]" alt="@[alt || '']" />
</avatar-disc>

<style>
  avatar-disc {
    position: relative;
    box-shadow:
      inset 0 0 0 calc(var(--unit) * 0.75) rgb(255 255 255 / 0.25),
      inset 0 0 0 1px rgb(0 0 0 / 0.5),
      0 calc(var(--unit) * 1.5) calc(var(--unit) * 3) calc(var(--unit) * -0.5) rgb(0 0 0 / 0.25);
  }

  avatar-disc img {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(100% * var(--zoom));
    transform: translate(calc(var(--x, 47) * -1%), calc(var(--y, 15) * -1%));
    pointer-events: none;
  }
</style>
