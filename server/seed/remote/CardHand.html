<card-hand flipped="@[flipped]" locked="@[locked]" style="--spread: @[spread]; --distance: @[distance]">
  <slot></slot>
</card-hand>

<style>
  card-hand {
    display: grid;
    place-items: center;
    padding: 2rem;

    slot > * {
      --angle: calc((sibling-index() - (sibling-count() + 1) / 2) * 360deg / sibling-count() * var(--spread));

      grid-area: 1 / 1;
      display: block;
      position: relative;
      transform-style: preserve-3d;
      transform: perspective(500px);
      translate: calc(sin(var(--angle)) * var(--distance) * 1px) calc((1 - cos(var(--angle))) * var(--distance) * 1px);
      rotate: var(--angle);
      transition: translate 350ms cubic-bezier(0.02, 1.35, 0.53, 1), rotate 350ms cubic-bezier(0.02, 1.35, 0.53, 1), transform 250ms ease-in 100ms;

      &, > * {
        backface-visibility: hidden;
      }

      &::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 0.75rem;
        background: radial-gradient(in oklab, #3d6b4f, #16261c);
        box-shadow: inset 0 0 0 0.5rem #c9a45c;
        transform: rotateY(180deg);
        backface-visibility: hidden;
        transition: filter 500ms linear;
      }
    }

    &:not([flipped]) slot > * {
      transform: perspective(500px) rotateY(180deg);
    }

    &[locked] slot > * {
      pointer-events: none;

      &::after {
        filter: grayscale(1);
      }
    }
  }
</style>
