<script type="module">
  import component from '@ape-egg/vibe/component';

  const OFFSET = 8;
  const INSET = 12;
  const instance = Math.random().toString(36).slice(2);
  const id = component({ instance, tooltip: null });

  const root = () => document.querySelector(`tooltip-root[data-instance="${instance}"]`);
  const clamp = (value, low, high) => Math.min(Math.max(value, low), high);

  let anchored = null;

  const detach = () => {
    anchored?.removeEventListener('mouseleave', hide);
    anchored = null;
  };

  const anchorPoint = (anchor, direction) => {
    if (anchor instanceof Element) {
      const r = anchor.getBoundingClientRect();
      const points = {
        down: { x: r.left + r.width / 2, y: r.bottom },
        left: { x: r.left, y: r.top + r.height / 2 },
        right: { x: r.right, y: r.top + r.height / 2 },
        up: { x: r.left + r.width / 2, y: r.top },
      };
      return points[direction] ?? { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    return anchor ? { x: anchor.x ?? anchor.clientX, y: anchor.y ?? anchor.clientY } : { x: 0, y: 0 };
  };

  const isOptions = (value) => value && !(value instanceof Element) && !('x' in value) && !('clientX' in value);

  const show = (anchor, { direction = 'none', lock, persist }) => {
    const target = anchorPoint(anchor, direction);
    const follow = !lock && anchor?.clientX !== undefined;

    $[id].tooltip = {
      x: follow ? anchor.clientX : target.x,
      y: follow ? anchor.clientY : target.y,
      design: root().querySelector(':scope > slot > *').outerHTML,
      direction,
      lock: !!lock,
    };

    if (anchor instanceof Element && !persist) {
      anchored = anchor;
      anchor.addEventListener('mouseleave', hide);
    }
  };

  const hide = () => {
    detach();
    $[id].tooltip = null;
  };

  const tooltips = (window.tooltips ??= new Map());
  tooltips.set(instance, { show, hide });

  window.showTooltip = (first, second) => {
    const [given, options = {}] = isOptions(first) ? [undefined, first] : [first, second];
    const owner = options.from
      ? tooltips.get(options.from.querySelector('tooltip-root').dataset.instance)
      : tooltips.values().next().value;
    window.hideTooltip();
    owner.show(given ?? window.event?.currentTarget, options);
  };

  window.hideTooltip = () => tooltips.forEach((tooltip) => tooltip.hide());

  let bodyLeft = 0;
  let bodyTop = 0;

  const body = () => root()?.querySelector('tooltip-layer > tooltip');

  const cut = (x, y) => {
    const cramped = root().querySelector('tooltip-layer > tooltip[cramped]');
    cramped?.style.setProperty('--cut-x', `${x - bodyLeft}px`);
    cramped?.style.setProperty('--cut-y', `${y - bodyTop}px`);
  };

  const move = ({ clientX, clientY }) => {
    const { tooltip } = $[id];
    if (!tooltip) return;
    if (!tooltip.lock) Object.assign(tooltip, { x: clientX, y: clientY });
    cut(clientX, clientY);
  };

  const position = () => {
    const el = body();
    if (!el) return;

    const { width, height } = el.getBoundingClientRect();
    if (!width || !height) return;

    const { x, y, direction } = $[id].tooltip;

    const ideals = {
      up: [x - width / 2, y - height - OFFSET],
      down: [x - width / 2, y + OFFSET],
      left: [x - width - OFFSET, y - height / 2],
      right: [x + OFFSET, y - height / 2],
      none: [x - width / 2, y - height / 2],
    };
    const [idealLeft, idealTop] = ideals[direction];
    const fitLeft = clamp(idealLeft, 0, Math.max(0, innerWidth - width));
    const fitTop = clamp(idealTop, 0, Math.max(0, innerHeight - height));

    const sideways = ['left', 'right'].includes(direction);
    const cramped = sideways ? fitLeft !== idealLeft : fitTop !== idealTop;
    const wasCramped = el.hasAttribute('cramped');
    el.toggleAttribute('cramped', cramped);

    bodyLeft = fitLeft;
    bodyTop = fitTop;
    if (cramped && !wasCramped) cut(x, y);

    const layer = el.parentElement.getBoundingClientRect();
    el.style.left = `${fitLeft - layer.left}px`;
    el.style.top = `${fitTop - layer.top}px`;

    const pointer = sideways
      ? clamp(y - fitTop, INSET, Math.max(INSET, height - INSET))
      : clamp(x - fitLeft, INSET, Math.max(INSET, width - INSET));
    el.style.setProperty('--pointer', `${pointer}px`);
    direction === 'none' || cramped ? el.removeAttribute('direction') : el.setAttribute('direction', direction);

    el.setAttribute('open', '');
  };

  const resize = new ResizeObserver(position);
  let observed = null;

  const update = () => {
    if (anchored && !anchored.isConnected) hide();
    if (body() !== observed) {
      resize.disconnect();
      observed = body();
      observed && resize.observe(observed);
    }
    position();
  };

  addEventListener('mousemove', move);
  $.on('afterUpdate', update);

  $.on('unmount', () => {
    removeEventListener('mousemove', move);
    resize.disconnect();
    detach();
    tooltips.delete(instance);
    if (tooltips.size) return;
    delete window.tooltips;
    delete window.showTooltip;
    delete window.hideTooltip;
  });
</script>

<tooltip-root data-instance="@[this.instance]">
  <slot></slot>
  <!-- if this.tooltip -->
  <tooltip-layer>
    <tooltip>
      <tooltip-main>@[$.unsafe(this.tooltip.design)]</tooltip-main>
    </tooltip>
  </tooltip-layer>
  <!-- /if -->
</tooltip-root>

<style>
  tooltip-root > slot > :first-child {
    display: none;
  }

  tooltip-layer {
    position: fixed;
    inset: 0 auto auto 0;
    z-index: var(--z-tooltip, 100);
  }

  tooltip[cramped] {
    mask: radial-gradient(
      circle calc(var(--unit) * 10) at var(--cut-x, 50%) var(--cut-y, 50%),
      rgb(0 0 0 / 0.65) 55%,
      #000 100%
    );
  }
</style>
