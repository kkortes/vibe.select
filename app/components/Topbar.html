<sticky grid locked auto-shadow>
  <crow justify-between g-4 h-12 w-full>
    <a href="/" secondary onclick="$.browsed = false"><strong>VIBE SELECT</strong></a>
    <crow>
      <a href="/components" class="button" tertiary active="@[['/components', '/components.html'].includes(path)]"><icon layout></icon>Components</a>
      <a href="https://vibe.korte.kim" target="_blank" rel="noopener" class="button" tertiary title="Vibe docs"><icon logo-vibe></icon>What is Vibe?</a>
      <button tertiary title="Switch theme" onclick="$.darkMode = !$.darkMode">
        <!-- if darkMode --><icon light></icon><!-- else --><icon dark></icon><!-- /if -->
      </button>
      <!-- if authReady -->
      <!-- if user -->
      <user-menu position="relative">
        <!-- if userMenuOpen --><user-backdrop position="fixed" t-0 r-0 b-0 l-0 onclick="$.userMenuOpen = false"></user-backdrop><!-- /if -->
        <button primary w="12" h="12" p-0 onclick="$.userMenuOpen = !$.userMenuOpen">
          <strong>@[user.name[0].toUpperCase()]</strong>
        </button>
        <!-- if userMenuOpen -->
        <card animate-slide-in-up toggled w="64" p-4 g-1>
          <strong>@[user.name]</strong>
          <span sm text-muted>@[user.email]</span>
          <hr my-3 />
          <button primary sm w-full onclick="$.signOut()">Sign out</button>
        </card>
        <!-- /if -->
      </user-menu>
      <!-- else -->
      <button primary w="24" onclick="$.signIn()">Sign in</button>
      <!-- /if -->
      <!-- else -->
      <span flex w="12" h="12" bg-slate animate-pulse></span>
      <!-- /if -->
    </crow>
  </crow>
</sticky>
