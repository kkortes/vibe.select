<catalogue w-full>
  <!-- each items as comp (comp.namespace + '/' + comp.slug) -->
  <card px-5 py-4 g-4 hover paper style="view-transition-name: c-@[comp.path.replace('/', '-')]">
    <crow up left g-4 f-1>
      <crow vertical left up g="1.5" f-1>
        <crow justify-between g-3 wrap w-full>
          <h5><a href="/@[comp.path]" secondary>@[comp.title]</a></h5>
          <crow g-2>
            <badge secondary>@[comp.path]</badge>
            <badge secondary>v@[comp.latest]</badge>
          </crow>
        </crow>
        <p text-muted>@[comp.description]</p>
      </crow>
    </crow>
    <tags>
      <crow left g-2 wrap>
        <span sm text-muted>Auto tags</span>
        <!-- each comp.tags as name -->
        <a href="@[$.tagged(name)]" onclick="event.preventDefault(); $.pick('@[name]')"><badge secondary active="@[tag === name]"><icon data-tag="@[name]"></icon>@[name]</badge></a>
        <!-- /each -->
      </crow>
      <crow left g-2 wrap>
        <span sm text-muted>User tags</span>
        <a href="@[$.tagged(comp.category)]" onclick="event.preventDefault(); $.pick('@[comp.category]')"><badge secondary active="@[tag === comp.category]">@[comp.category]</badge></a>
      </crow>
    </tags>
  </card>
  <!-- /each -->
</catalogue>
