<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Namespace — Vibe select</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/stylecheat.css" />
  <link rel="stylesheet" href="/css/blueprint.css" />
  <script async src="https://accounts.google.com/gsi/client"></script>

  <script>
    // The Worker serves this page at /<namespace>, a path vibe would derive no
    // manifest from, so it is told where the manifest lives.
    window.__MANIFEST__ = '/vibe-hyperspeed/namespace.html.manifest.js';
  </script>

  <script type="module">
    import vibe from '/modules/vibe/index.js';

    import boot from '/js/boot.js';
    import globalState from '/js/globalState.js';
    import { load, state } from '/js/namespace.js';

    boot(() => vibe({ ...globalState, ...state }), load);
  </script>
</head>

<body stylecheat vibe-fouc>
  <component src="/components/Layout.html">
    <box main>
      <container>
        <crow vertical left g-3 w-full>
          <h1>@[namespace]</h1>
          <p lead max-w-160>Every component published under <code>@[namespace]/</code>.</p>
        </crow>
      </container>
    </box>

    <component src="/components/Filters.html"></component>

    <box>
      <!-- if loading -->
      <crow g-2 w-full py="12" text-muted><icon spinner animate-spin></icon> Loading the namespace</crow>
      <!-- else -->
      <!-- if matches.length -->
      <component src="/components/Gallery.html" items="@[matches]"></component>
      <!-- else -->
      <crow w-full py="12" text-muted>
        <!-- if query -->Nothing matches “@[query]”.<!-- else -->No components published in @[namespace] yet.<!-- /if -->
      </crow>
      <!-- /if -->
      <!-- /if -->
    </box>
  </component>
</body>

</html>
